[project]
name = "edf"
version = "0.1.0"
description = "Probabilistic short-term electricity demand forecasting for Great Britain"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "requests>=2.31",
    "holidays>=0.47",
    "pyarrow>=15.0",
    "python-dateutil>=2.9",
    "mlflow>=3.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
